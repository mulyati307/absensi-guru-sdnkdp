<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Guru - SD Negeri Kadupeureup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#fff8e6;--card:#ffffff;--ink:#2b2a20;--mut:#6b6650;--line:#eadfb8;--field:#fffdf5;
--pri:#0f77b8;--priink:#fff;--hadir:#3f8f2a;--sakit:#b23a3a;--izin:#a35c00;
--shadow:0 6px 18px rgba(120,90,0,.12);
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150c;--card:#23200f;--ink:#f4efd8;--mut:#b5ad8a;--line:#3d3718;--field:#1b1909;--pri:#4fb3ea;--priink:#04202f;--hadir:#7cc95f;--sakit:#f08a8a;--izin:#f0b25a;--shadow:0 6px 18px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#17150c;--card:#23200f;--ink:#f4efd8;--mut:#b5ad8a;--line:#3d3718;--field:#1b1909;--pri:#4fb3ea;--priink:#04202f;--hadir:#7cc95f;--sakit:#f08a8a;--izin:#f0b25a;--shadow:0 6px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(160deg,#ffd23f 0%,#f5ac00 100%);color:#2f2300;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 0;text-align:center}
.hd{max-width:640px;margin:0 auto}
.logo{width:96px;height:96px;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 16px rgba(80,50,0,.3);background:#fff;object-fit:cover}
header h1{margin:12px 0 2px;font-size:1.55rem;font-weight:800;line-height:1.2}
header p{margin:0;font-weight:700;opacity:.85}
.date{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.55);font-weight:700;font-size:.92rem}
.wave{display:block;width:100%;height:46px;margin-top:6px}
.wave .a{fill:#1e9be0}
.wave .b{fill:var(--bg)}
main{max-width:640px;margin:0 auto;padding:0 16px 48px;margin-top:-6px}
.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{margin:0 0 14px;font-size:1.1rem;font-weight:800}
label.l{display:block;font-weight:700;margin:16px 0 6px}
label.l:first-of-type{margin-top:0}
select,textarea,input[type=file]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:100px;margin:0}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:12px 8px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--field);font-weight:600}
.seg input:focus-visible+span{outline:3px solid var(--pri);outline-offset:2px}
#jenis input:checked+span{background:var(--pri);border-color:var(--pri);color:var(--priink);font-weight:800}
.s-Hadir input:checked+span{background:var(--hadir);border-color:var(--hadir);color:#fff;font-weight:800}
.s-Sakit input:checked+span{background:var(--sakit);border-color:var(--sakit);color:#fff;font-weight:800}
.s-Izin input:checked+span{background:var(--izin);border-color:var(--izin);color:#fff;font-weight:800}
:root[data-theme="dark"] .seg input:checked+span,:root:not([data-theme="light"]) .seg.dk input:checked+span{color:#10200a}
.time{padding:12px;border:1.5px dashed var(--line);border-radius:12px;color:var(--mut)}
.time b{color:var(--ink);display:block}
.cam{background:#14110a;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#d8d1b3;text-align:center;padding:12px}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;margin:-12px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button,.fbtn{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button.main{background:var(--pri);color:var(--priink);border-color:var(--pri);width:100%;padding:14px;margin-top:20px;font-size:1.05rem;font-weight:800}
.hint{color:var(--mut);font-size:.9rem;margin:8px 0 0}
.msg{font-size:.95rem;margin:10px 0 0;min-height:1.3em;font-weight:700;color:var(--sakit)}
.msg.ok{color:var(--hadir)}
.hide{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.6rem;line-height:1.1;font-weight:800}
.stat small{color:var(--mut);font-weight:700}
.stat.Hadir b{color:var(--hadir)}.stat.Sakit b{color:var(--sakit)}.stat.Izin b{color:var(--izin)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.top h2{margin:0}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img{width:62px;height:62px;object-fit:cover;border-radius:12px;flex:none;background:var(--line)}
.item .t{font-weight:800}
.item .m{color:var(--mut);font-size:.9rem}
.badge{display:inline-block;padding:0 9px;border-radius:99px;font-size:.8rem;font-weight:800;border:1.5px solid currentColor;vertical-align:middle}
.badge.Hadir{color:var(--hadir)}.badge.Sakit{color:var(--sakit)}.badge.Izin{color:var(--izin)}
.empty{color:var(--mut);margin:0}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding-bottom:24px}
.note{background:var(--field);border:1.5px solid var(--izin);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-weight:700}
.jam{margin:8px 0 0;padding:10px 12px;border-radius:12px;font-weight:700;font-size:.95rem;border:1.5px solid var(--line)}
.jam.open{color:var(--hadir)}
.jam.closed{color:var(--sakit);border-color:var(--sakit)}
.item img{cursor:default}
.hide{display:none!important}
.ok-card{text-align:center}
.ok-ic{width:88px;height:88px;margin:4px auto 10px;border-radius:50%;background:var(--hadir);display:flex;align-items:center;justify-content:center;animation:pop .45s ease-out}
.ok-ic svg{width:46px;height:46px;stroke:#fff;fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.ok-card h2{font-size:1.35rem;color:var(--hadir);margin-bottom:4px}
.ok-card .sub{color:var(--mut);margin:0 0 16px}
.dl{text-align:left;border:1.5px solid var(--line);border-radius:14px;background:var(--field);padding:4px 14px}
.dl div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.dl div:first-child{border-top:0}
.dl span{color:var(--mut)}.dl b{text-align:right}
.ok-note{margin:14px 0 0;padding:10px 12px;border-radius:12px;border:1.5px solid var(--pri);font-weight:700}
@media (prefers-reduced-motion:reduce){.ok-ic{animation:none}}
input[type=text],input[type=password],input[type=date],input[type=month]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:inherit}
.tabs{display:flex;gap:6px;margin:0 0 14px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;font-size:.9rem;border-radius:10px}
.tabs button.on{background:var(--pri);color:var(--priink)}
.who{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 12px;font-weight:700}
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
.stat.TH b,.badge.TH{color:var(--mut)}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select{width:100%}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 6px;text-align:center;border-top:1px solid var(--line)}
th{color:var(--mut);font-size:.82rem;border-top:0}
td:first-child,th:first-child{text-align:left}
.act{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.small{padding:5px 12px;font-size:.85rem}
.del{color:var(--sakit)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:50}
#modal .box{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:440px;margin-top:5vh}
#modal img{max-width:100%;border-radius:12px}
.item .t{overflow-wrap:anywhere}
</style>
</head>

<main id="app" style="margin-top:0;padding-top:14px"></main>
<div id="modal" class="hide" role="dialog" aria-modal="true"></div>
<script>
(function(){
var API="https://script.google.com/macros/s/AKfycby158lG8WysSv2W1PpDJgOC0Kp2Rz1fPk6SqNas7U8huE6ttKZlBZnzX1QXO-0-4vFM/exec";
var TZ="Asia/Jakarta",TK="absensi-sdn-token";
var $=function(i){return document.getElementById(i)};
var tok=null,me=null,off=0,tab="",stream=null,foto=null,bukti=null,busy=false,guruAll=[],cache={},rb="",rm="harian",sesiNow="Masuk";
var BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function now(){return new Date(Date.now()+off)}
function iso(d){return d.toLocaleDateString("en-CA",{timeZone:TZ})}
function tglId(t){t=String(t||"");if(!/^\d{4}-\d{2}-\d{2}$/.test(t))return t||"-";var p=t.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function cls(s){return s==="Hadir"||s==="Izin"||s==="Sakit"?s:"TH"}
function badge(s){return '<span class="badge '+cls(s)+'">'+esc(s)+'</span>'}
function msg(t,ok){var m=$("msg");if(m){m.textContent=t;m.className="msg"+(ok?" ok":"")}}
function tick(){var n=now();$("tglHead").textContent=n.toLocaleDateString("id-ID",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"});
  var w=$("waktu");if(w)w.textContent=n.toLocaleTimeString("id-ID",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit"}).replace(/\./g,":")+" WIB"}
tick();setInterval(tick,1000);

function api(a,p){p=p||{};p.a=a;p.t=tok;
  return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p)})
  .then(function(r){return r.json()}).then(function(j){if(j.auth)logout();return j})
  .catch(function(){return{ok:false,error:"Gagal terhubung. Periksa internet lalu coba lagi."}})}
function logout(){tok=null;me=null;ls(TK,null);stopCam();boot()}

/* modal */
function modal(h){$("modal").innerHTML='<div class="box">'+h+'</div>';$("modal").classList.remove("hide")}
function closeM(){$("modal").classList.add("hide");$("modal").innerHTML=""}

/* login */
function vLogin(list){
  $("app").innerHTML='<div class="card"><h2>Masuk</h2><label class="l" for="lg">Nama</label><select id="lg"><option value="">Pilih nama</option>'+
  list.map(function(g){return'<option value="'+esc(g.id)+'">'+esc(g.nama)+'</option>'}).join("")+
  '</select><label class="l" for="pin">PIN</label><input type="password" id="pin" inputmode="numeric" autocomplete="current-password" placeholder="PIN Anda"><p class="msg" id="msg" role="alert"></p><button class="main" data-a="login">Masuk</button><p class="hint">Lupa PIN? Hubungi kepala sekolah.</p></div><p class="hint" style="text-align:center">Absensi SD Negeri Kadupeureup - Versi 2.0</p>';
}
function boot(){
  closeM();$("app").innerHTML='<div class="card"><p class="empty">Memuat...</p></div>';
  fetch(API).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)throw 0;off=j.now-Date.now();
    var t=ls(TK);
    if(t){tok=t;return api("saya").then(function(s){if(s.ok){me=s.user;setHari(s);off=s.now-Date.now();enter()}else vLogin(j.guru)})}
    vLogin(j.guru);
  }).catch(function(){$("app").innerHTML='<div class="card"><p class="msg">Tidak dapat terhubung ke database. Periksa internet lalu muat ulang halaman.</p></div>'});
}
function enter(){tab=me.admin?"dash":"isi";shell()}
function shell(){
  stopCam();
  var T=me.admin?[["dash","Dashboard"],["absensi","Data Absensi"],["guru","Data Guru"]]:[["isi","Isi Absensi"],["riwayat","Riwayat"],["rekap","Rekap"]];
  $("app").innerHTML='<div class="who"><span>'+esc(me.nama)+' <small style="color:var(--mut)">('+esc(me.peran)+')</small></span><span><button class="small" data-a="pinForm">Ganti PIN</button> <button class="small" data-a="out">Keluar</button></span></div><div class="tabs">'+
  T.map(function(t){return'<button data-a="tab" data-v="'+t[0]+'" class="'+(t[0]===tab?"on":"")+'">'+t[1]+'</button>'}).join("")+'</div><div id="view"></div><p class="hint" style="text-align:center">Absensi SD Negeri Kadupeureup - Versi 2.0</p>';
  ({isi:vIsi,riwayat:vRiwayat,rekap:vRekap,dash:vDash,absensi:vAbsensi,guru:vGuru})[tab]();
}
function setHari(s){me.masuk=s.masuk||null;me.pulang=s.pulang||null;me.jadwal=s.jadwal||{}}
function jm(x){return x.jam?x.jam+" WIB":"dicatat admin"}
function csv(n,rows){var t="\ufeff"+rows.map(function(r){return r.map(function(c){return'"'+String(c==null?"":c).replace(/"/g,'""')+'"'}).join(";")}).join("\r\n");var l=document.createElement("a");l.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));l.download=n;document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(l.href);l.remove()},500)}
function loading(){$("view").innerHTML='<div class="card"><p class="empty">Memuat...</p></div>'}

/* ---------- USER: isi absensi ---------- */
function done(m,p){
  var r=[["Nama",me.nama],["Tanggal",tglId(m.tgl)],["Absen masuk",jm(m)+" ("+m.status+")"]];
  if(m.ket)r.push(["Keterangan",m.ket]);
  if(m.status==="Hadir")r.push(["Absen pulang",p?jm(p):"Belum diisi"]);
  var ttl=m.status!=="Hadir"?"Absensi Hari Ini Tersimpan":(p?"Absensi Hari Ini Lengkap":"Absen Masuk Tersimpan");
  return'<div class="card ok-card"><div class="ok-ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><h2>'+ttl+'</h2><p class="sub">Terima kasih, data Anda sudah masuk ke database sekolah.</p><div class="dl">'+
  r.map(function(x){return'<div><span>'+x[0]+'</span><b>'+esc(x[1])+'</b></div>'}).join("")+
  '</div><p class="ok-note">Absen masuk dan absen pulang masing-masing hanya bisa diisi satu kali per hari. Jika ada kesalahan, hubungi kepala sekolah.</p></div>';
}
function vIsi(){
  var m=me.masuk,p=me.pulang,j=me.jadwal||{};
  if(m&&(m.status!=="Hadir"||p)){$("view").innerHTML=done(m,p);return}
  foto=null;bukti=null;
  var pl=!!m,w;sesiNow=pl?"Pulang":"Masuk";w=j[sesiNow]||{};
  var top=pl?done(m,null):"",nm=pl?"pulang":"masuk";
  if(j.aktif&&!w.open){
    $("view").innerHTML=top+'<div class="card"><h2>Absen '+nm+'</h2><p class="jam closed">'+(j.libur?"Hari Minggu tidak ada absensi.":"Absen "+nm+" hanya dibuka pukul "+esc(w.buka)+" - "+esc(w.tutup)+" WIB.")+'</p><div class="row"><button type="button" data-a="refresh">Muat ulang</button></div></div>';
    return;
  }
  $("view").innerHTML=top+'<div class="card"><h2>'+(pl?"Absen pulang":"Absen masuk")+'</h2>'+(j.aktif?'<p class="jam open">Dibuka sampai pukul '+esc(w.tutup)+' WIB.</p>':"")+
  '<label class="l">Nama</label><div class="time"><b>'+esc(me.nama)+'</b>'+esc(me.peran)+'</div>'+
  '<label class="l">Tanggal dan jam (otomatis)</label><div class="time">'+tglId(iso(now()))+'<b id="waktu"></b></div>'+
  (pl?'':'<label class="l">Status kehadiran</label><div class="seg dk"><label class="s-Hadir"><input type="radio" name="status" value="Hadir" checked><span>Hadir</span></label><label class="s-Izin"><input type="radio" name="status" value="Izin"><span>Izin</span></label><label class="s-Sakit"><input type="radio" name="status" value="Sakit"><span>Sakit</span></label></div>')+
  '<div id="bH"><label class="l">Foto langsung</label><div class="cam" id="cam"><span>Belum ada foto</span></div><div class="row"><button type="button" id="cOpen" data-a="cOpen">Buka kamera</button><button type="button" id="cShot" class="hide" data-a="cShot">Ambil foto</button><button type="button" id="cRe" class="hide" data-a="cRe">Foto ulang</button><button type="button" id="cFile" class="hide" data-a="cFile">Pakai kamera HP</button><input type="file" accept="image/*" capture="user" id="fileCam" class="hide"></div></div>'+
  (pl?'':'<div id="bI" class="hide"><label class="l" for="ket">Keterangan</label><textarea id="ket" placeholder="Contoh: demam, surat dokter terlampir"></textarea><label class="l" for="bukti">Bukti (surat dokter, surat izin, dll.)</label><input type="file" id="bukti" accept="image/*"><img id="pv" alt="Pratinjau bukti" class="hide" style="max-width:100%;max-height:200px;margin-top:10px;border-radius:12px"></div>')+
  '<p class="msg" id="msg" role="alert"></p><button class="main" id="kirim" data-a="kirim">'+(pl?"Simpan absen pulang":"Simpan absen masuk")+'</button></div>';
  tick();
}
function shrink(s,w,h){var k=Math.min(1,480/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(s,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.6)}
function f2u(f,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){cb(shrink(i,i.width,i.height))};i.src=r.result};r.readAsDataURL(f)}
function stopCam(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
function setFoto(u){foto=u;stopCam();$("cam").innerHTML='<img alt="Foto absensi" src="'+u+'">';["cOpen","cShot","cFile"].forEach(function(i){$(i).classList.add("hide")});$("cRe").classList.remove("hide")}
function noCam(){$("cFile").classList.remove("hide");$("cam").innerHTML="<span>Kamera tidak bisa dibuka. Gunakan tombol Pakai kamera HP.</span>"}
function camOpen(){
  msg("");if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return noCam();
  navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}).then(function(s){
    stream=s;var v=document.createElement("video");v.autoplay=true;v.playsInline=true;v.muted=true;v.srcObject=s;v.id="vid";
    $("cam").innerHTML="";$("cam").appendChild(v);$("cOpen").classList.add("hide");$("cShot").classList.remove("hide");
  }).catch(noCam);
}
function kirim(){
  if(busy)return;var st=sesiNow==="Pulang"?"Hadir":document.querySelector('input[name=status]:checked').value,ket=$("ket")?$("ket").value.trim():"";
  if(st==="Hadir"&&!foto)return msg("Ambil foto langsung terlebih dahulu.");
  if(st!=="Hadir"){if(!ket)return msg("Isi keterangan terlebih dahulu.");if(!bukti)return msg("Unggah bukti terlebih dahulu.")}
  busy=true;$("kirim").disabled=true;msg("Menyimpan...");
  api("isi",{sesi:sesiNow,status:st,ket:st==="Hadir"?"":ket,gambar:st==="Hadir"?foto:bukti}).then(function(j){
    busy=false;
    if(!j.ok){if($("kirim")){$("kirim").disabled=false;msg(j.error)}return}
    if(j.rec.sesi==="Pulang")me.pulang=j.rec;else me.masuk=j.rec;
    stopCam();vIsi();window.scrollTo(0,0);
  });
}

/* ---------- USER: riwayat & rekap ---------- */
function vRiwayat(){
  loading();api("riwayat").then(function(j){
    if(!j.ok)return;
    $("view").innerHTML='<div class="card"><h2>Riwayat absensi saya</h2>'+(j.list.length?j.list.map(function(x){
      return'<div class="item"><div><div class="t">'+tglId(x.tgl)+' '+badge(x.status)+' <span class="badge TH">Absen '+esc(x.sesi)+'</span></div><div class="m">Jam '+jm(x)+'</div>'+(x.ket?'<div class="m">Keterangan: '+esc(x.ket)+'</div>':'')+'</div></div>'}).join(""):'<p class="empty">Belum ada absensi.</p>')+'</div>';
  });
}
function cards(c){return'<div class="g4"><div class="stat Hadir"><b>'+c.H+'</b><small>Hadir</small></div><div class="stat Izin"><b>'+c.I+'</b><small>Izin</small></div><div class="stat Sakit"><b>'+c.S+'</b><small>Sakit</small></div><div class="stat TH"><b>'+c.T+'</b><small>Tidak Hadir</small></div></div>'}
function vRekap(){
  rb=rb||iso(now()).slice(0,7);loading();
  api("rekap",{bulan:rb}).then(function(j){
    if(!j.ok)return;
    var h='<div class="card"><h2>Rekap absensi saya</h2><div class="row" style="margin:0 0 12px"><button class="small" data-a="rm" data-v="harian" '+(rm==="harian"?'style="background:var(--pri);color:var(--priink)"':"")+'>Harian</button><button class="small" data-a="rm" data-v="bulanan" '+(rm==="bulanan"?'style="background:var(--pri);color:var(--priink)"':"")+'>Bulanan</button></div>'+
    '<label class="l" for="rbln">Bulan</label><input type="month" id="rbln" value="'+j.bulan+'">';
    if(rm==="harian"){
      h+=cards(j.c)+(j.harian.length?j.harian.slice().reverse().map(function(x){return'<div class="item"><div><div class="t">'+tglId(x.tgl)+' '+badge(x.status)+'</div>'+(x.jam||x.pulang?'<div class="m">Masuk '+(x.jam?esc(x.jam)+' WIB':'-')+(x.pulang?', pulang '+esc(x.pulang)+' WIB':'')+'</div>':'')+'</div></div>'}).join(""):'<p class="empty">Belum ada data bulan ini.</p>');
    }else{
      h+='<p class="hint">Tahun '+j.bulan.slice(0,4)+'</p><div style="overflow-x:auto"><table><tr><th>Bulan</th><th>Hadir</th><th>Izin</th><th>Sakit</th><th>Tidak</th></tr>'+
      j.tahun.map(function(x){return'<tr><td>'+BLN[+x.b.slice(5)-1]+'</td><td>'+x.c.H+'</td><td>'+x.c.I+'</td><td>'+x.c.S+'</td><td>'+x.c.T+'</td></tr>'}).join("")+'</table></div>';
    }
    $("view").innerHTML=h+'<p class="hint">Hari tanpa pengisian dihitung tidak hadir hanya pada hari ketika ada guru yang mengisi absensi (hari efektif).</p></div>';
  });
}

/* ---------- ADMIN: dashboard ---------- */

    k.list.map(function(x){return'<tr><td>'+esc(x.nama)+'</td><td>'+x.c.H+'</td><td>'+x.c.I+'</td><td>'+x.c.S+'</td><td>'+x.c.T+'</td></tr>'}).join("")+'</table></div></div>';
  });
}

/* ---------- ADMIN: data absensi ---------- */
var aB="",aG="",aList=[];
function vAbsensi(){
  aB=aB||iso(now()).slice(0,7);loading();
  Promise.all([api("guruList"),api("absensiList",{bulan:aB,gid:aG})]).then(function(r){
    if(!r[0].ok||!r[1].ok)return;guruAll=r[0].list;cache={};aList=r[1].list;
    $("view").innerHTML='<div class="card"><div class="top"><h2>Data absensi</h2><span><button class="small" data-a="aAdd">+ Tambah</button> <button class="small" data-a="csvAbs">Unduh Excel</button></span></div><div class="filters"><input type="month" id="abln" value="'+aB+'" aria-label="Bulan"><select id="agur" aria-label="Guru"><option value="">Semua guru</option>'+
    guruAll.map(function(g){return'<option value="'+esc(g.id)+'"'+(g.id===aG?" selected":"")+'>'+esc(g.nama)+'</option>'}).join("")+'</select></div><p class="hint">'+r[1].list.length+' data</p>'+
    (r[1].list.length?r[1].list.map(function(x){cache[x.id]=x;
      return'<div class="item"><div><div class="t">'+esc(x.nama)+' '+badge(x.status)+' <span class="badge TH">'+esc(x.sesi)+'</span></div><div class="m">'+tglId(x.tgl)+', '+jm(x)+'</div>'+(x.ket?'<div class="m">Keterangan: '+esc(x.ket)+'</div>':'')+
      '<div class="act">'+(x.foto?'<button class="small" data-a="foto" data-id="'+x.id+'">Lihat foto</button>':'')+'<button class="small" data-a="aEdit" data-id="'+x.id+'">Edit</button><button class="small del" data-a="aDel" data-id="'+x.id+'">Hapus</button></div></div></div>'}).join(""):'<p class="empty">Tidak ada data.</p>')+'</div>';
  });
}
function aAdd(){
  modal('<h2>Tambah absensi manual</h2><p class="hint">Untuk guru yang tidak bisa mengisi sendiri. Tanpa foto.</p><label class="l" for="nG">Guru</label><select id="nG">'+
  guruAll.filter(function(g){return g.aktif&&g.peran!=="Kepala Sekolah"}).map(function(g){return'<option value="'+esc(g.id)+'">'+esc(g.nama)+'</option>'}).join("")+
  '</select><label class="l" for="nSes">Sesi</label><select id="nSes"><option>Masuk</option><option>Pulang</option></select><label class="l" for="nT">Tanggal</label><input type="date" id="nT" value="'+iso(now())+'"><label class="l" for="nS">Status</label><select id="nS"><option>Hadir</option><option>Izin</option><option>Sakit</option><option>Tidak Hadir</option></select><label class="l" for="nK">Keterangan</label><textarea id="nK"></textarea><p class="msg" id="msg"></p><div class="row"><button class="main" style="margin:0;flex:1" data-a="nSave">Simpan</button><button data-a="mClose">Batal</button></div>');

function pinForm(){

function aEdit(id){
  var x=cache[id];if(!x)return;

  '</select><label class="l" for="eT">Tanggal</label><input type="date" id="eT" value="'+x.tgl+'"><label class="l" for="eK">Keterangan</label><textarea id="eK">'+esc(x.ket)+'</textarea><p class="msg" id="msg"></p><div class="row"><button class="main" style="margin:0;flex:1" data-a="eSave" data-id="'+id+'">Simpan</button><button data-a="mClose">Batal</button></div>');

/* ---------- ADMIN: data guru ---------- */
function vGuru(){
  loading();api("guruList").then(function(j){
    if(!j.ok)return;guruAll=j.list;
    $("view").innerHTML='<div class="card"><div class="top"><h2>Data guru</h2><button class="small" data-a="gForm" data-id="">+ Tambah</button></div>'+
    j.list.map(function(g){return'<div class="item"><div><div class="t">'+esc(g.nama)+' '+(g.aktif?"":'<span class="badge TH">Nonaktif</span>')+'</div><div class="m">'+esc(g.peran)+'</div><div class="act"><button class="small" data-a="gForm" data-id="'+esc(g.id)+'">Edit</button><button class="small del" data-a="gDel" data-id="'+esc(g.id)+'">Hapus</button></div></div></div>'}).join("")+

/* ---------- event ---------- */
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.getAttribute("data-a"),id=b.getAttribute("data-id"),v=b.getAttribute("data-v");
  if(a==="login"){
    var i=$("lg").value,p=$("pin").value;if(!i||!p)return msg("Pilih nama dan isi PIN.");
    b.disabled=true;msg("Memeriksa...");
    api("login",{id:i,pin:p}).then(function(j){b.disabled=false;if(!j.ok)return msg(j.error);tok=j.token;ls(TK,tok);off=j.now-Date.now();me=j.user;api("saya").then(function(s){setHari(s.ok?s:{});enter()})});
  }
  else if(a==="out")logout();
  else if(a==="tab"){tab=v;shell()}
  else if(a==="cOpen")camOpen();
  else if(a==="cShot"){var vd=$("vid");if(vd&&vd.videoWidth)setFoto(shrink(vd,vd.videoWidth,vd.videoHeight))}
  else if(a==="cRe"){foto=null;$("cam").innerHTML="<span>Belum ada foto</span>";$("cRe").classList.add("hide");camOpen()}
  else if(a==="cFile")$("fileCam").click();
  else if(a==="kirim")kirim();
  else if(a==="refresh")api("saya").then(function(s){if(s.ok){off=s.now-Date.now();setHari(s);vIsi()}});
  else if(a==="rm"){rm=v;vRekap()}
  else if(a==="mClose")closeM();
  else if(a==="foto"){b.disabled=true;api("foto",{id:id}).then(function(j){b.disabled=false;if(!j.ok)return alert(j.error);modal('<img alt="Foto absensi" src="'+j.src+'"><div class="row"><button data-a="mClose">Tutup</button></div>')})}
  else if(a==="aEdit")aEdit(id);
  else if(a==="aAdd")aAdd();
  else if(a==="nSave")api("absensiTambah",{gid:$("nG").value,sesi:$("nSes").value,tgl:$("nT").value,status:$("nS").value,ket:$("nK").value}).then(function(j){if(!j.ok)return msg(j.error);closeM();vAbsensi()});
  else if(a==="pinForm")pinForm();
  else if(a==="pSave")api("ubahPin",{lama:$("pL").value,baru:$("pB").value}).then(function(j){if(!j.ok)return msg(j.error);msg("PIN berhasil diganti.",true);setTimeout(closeM,1200)});
  else if(a==="csvAbs")csv("data-absensi-"+aB+".csv",[["Tanggal","Sesi","Jam","Nama","Peran","Status","Keterangan"]].concat(aList.map(function(x){return[x.tgl,x.sesi,x.jam,x.nama,x.peran,x.status,x.ket]})));
  else if(a==="csvRekap")csv("rekap-bulanan-"+dB+".csv",[["Nama","Peran","Hadir","Izin","Sakit","Tidak Hadir"]].concat(dList.map(function(x){return[x.nama,x.peran,x.c.H,x.c.I,x.c.S,x.c.T]})));
  else if(a==="eSave")api("absensiEdit",{id:id,status:$("eS").value,tgl:$("eT").value,ket:$("eK").value}).then(function(j){if(!j.ok)return msg(j.error);closeM();vAbsensi()});
  else if(a==="aDel"){if(confirm("Hapus data absensi ini? Tindakan ini tidak bisa dibatalkan."))api("absensiHapus",{id:id}).then(function(j){if(!j.ok)return alert(j.error);vAbsensi()})}
  else if(a==="gForm")gForm(id);
  else if(a==="gSave")api("guruSimpan",{id:id,nama:$("gN").value,peran:$("gP").value,aktif:$("gA").value==="1",pin:$("gX").value}).then(function(j){if(!j.ok)return msg(j.error);closeM();vGuru()});
  else if(a==="gDel"){if(confirm("Hapus guru ini dari daftar? Data absensi lamanya tetap tersimpan."))api("guruHapus",{id:id}).then(function(j){if(!j.ok)return alert(j.error);vGuru()})}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="fileCam"&&t.files[0])f2u(t.files[0],setFoto);
  else if(t.id==="bukti"){bukti=null;if(t.files[0])f2u(t.files[0],function(u){bukti=u;$("pv").src=u;$("pv").classList.remove("hide")});else $("pv").classList.add("hide")}
  else if(t.name==="status"){var h=t.value==="Hadir";$("bH").classList.toggle("hide",!h);$("bI").classList.toggle("hide",h);if(!h)stopCam();msg("")}
  else if(t.id==="rbln"&&t.value){rb=t.value;vRekap()}
  else if(t.id==="dtgl"&&t.value){dTgl=t.value;dB=t.value.slice(0,7);vDash()}
  else if(t.id==="dbln"&&t.value){dB=t.value;vDash()}
  else if(t.id==="abln"&&t.value){aB=t.value;vAbsensi()}
  else if(t.id==="agur"){aG=t.value;vAbsensi()}
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="pin"){var b=document.querySelector('[data-a="login"]');if(b)b.click()}});
boot();
})();
