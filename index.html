<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Absensi Guru - UPT SDN Kadupeureup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#fff8e6;--card:#ffffff;--ink:#2b2a20;--mut:#6b6650;--line:#eadfb8;--field:#fffdf5;
--pri:#0f77b8;--priink:#fff;--hadir:#3f8f2a;--sakit:#b23a3a;--izin:#a35c00;
--shadow:0 6px 18px rgba(120,90,0,.12);
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150c;--card:#23200f;--ink:#f4efd8;--mut:#b5ad8a;--line:#3d3718;--field:#1b1909;--pri:#4fb3ea;--priink:#04202f;--hadir:#7cc95f;--sakit:#f08a8a;--izin:#f0b25a;--shadow:0 6px 18px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#17150c;--card:#23200f;--ink:#f4efd8;--mut:#b5ad8a;--line:#3d3718;--field:#1b1909;--pri:#4fb3ea;--priink:#04202f;--hadir:#7cc95f;--sakit:#f08a8a;--izin:#f0b25a;--shadow:0 6px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito","Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(160deg,#ffd23f 0%,#f5ac00 100%);color:#2f2300;padding:calc(22px + env(safe-area-inset-top,0px)) 16px 0;text-align:center}
.hd{max-width:640px;margin:0 auto}
.logo{width:96px;height:96px;border-radius:50%;border:4px solid #fff;box-shadow:0 6px 16px rgba(80,50,0,.3);background:#fff;object-fit:cover}
header h1{margin:12px 0 2px;font-size:1.55rem;font-weight:800;line-height:1.2}
header p{margin:0;font-weight:700;opacity:.85}
.date{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.55);font-weight:700;font-size:.92rem}
.wave{display:block;width:100%;height:46px;margin-top:6px}
.wave .a{fill:#1e9be0}
.wave .b{fill:var(--bg)}
main{max-width:640px;margin:0 auto;padding:0 16px 48px;margin-top:-6px}
.card{background:var(--card);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h2{margin:0 0 14px;font-size:1.1rem;font-weight:800}
label.l{display:block;font-weight:700;margin:16px 0 6px}
label.l:first-of-type{margin-top:0}
select,textarea,input[type=file]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font:inherit}
textarea{min-height:90px;resize:vertical}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{flex:1;min-width:100px;margin:0}
.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:12px 8px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;background:var(--field);font-weight:600}
.seg input:focus-visible+span{outline:3px solid var(--pri);outline-offset:2px}
#jenis input:checked+span{background:var(--pri);border-color:var(--pri);color:var(--priink);font-weight:800}
.s-Hadir input:checked+span{background:var(--hadir);border-color:var(--hadir);color:#fff;font-weight:800}
.s-Sakit input:checked+span{background:var(--sakit);border-color:var(--sakit);color:#fff;font-weight:800}
.s-Izin input:checked+span{background:var(--izin);border-color:var(--izin);color:#fff;font-weight:800}
:root[data-theme="dark"] .seg input:checked+span,:root:not([data-theme="light"]) .seg.dk input:checked+span{color:#10200a}
.time{padding:12px;border:1.5px dashed var(--line);border-radius:12px;color:var(--mut)}
.time b{color:var(--ink);display:block}
.cam{background:#14110a;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#d8d1b3;text-align:center;padding:12px}
.cam video,.cam img{width:100%;height:100%;object-fit:cover;margin:-12px}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button,.fbtn{font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button.main{background:var(--pri);color:var(--priink);border-color:var(--pri);width:100%;padding:14px;margin-top:20px;font-size:1.05rem;font-weight:800}
.hint{color:var(--mut);font-size:.9rem;margin:8px 0 0}
.msg{font-size:.95rem;margin:10px 0 0;min-height:1.3em;font-weight:700;color:var(--sakit)}
.msg.ok{color:var(--hadir)}
.hide{display:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.6rem;line-height:1.1;font-weight:800}
.stat small{color:var(--mut);font-weight:700}
.stat.Hadir b{color:var(--hadir)}.stat.Sakit b{color:var(--sakit)}.stat.Izin b{color:var(--izin)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.top h2{margin:0}
.item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img{width:62px;height:62px;object-fit:cover;border-radius:12px;flex:none;background:var(--line)}
.item .t{font-weight:800}
.item .m{color:var(--mut);font-size:.9rem}
.badge{display:inline-block;padding:0 9px;border-radius:99px;font-size:.8rem;font-weight:800;border:1.5px solid currentColor;vertical-align:middle}
.badge.Hadir{color:var(--hadir)}.badge.Sakit{color:var(--sakit)}.badge.Izin{color:var(--izin)}
.empty{color:var(--mut);margin:0}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding-bottom:24px}
.note{background:var(--field);border:1.5px solid var(--izin);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-weight:700}
.jam{margin:8px 0 0;padding:10px 12px;border-radius:12px;font-weight:700;font-size:.95rem;border:1.5px solid var(--line)}
.jam.open{color:var(--hadir)}
.jam.closed{color:var(--sakit);border-color:var(--sakit)}
.item img{cursor:default}
.hide{display:none!important}
</style>
</head>

<h1>Absensi Guru dan Tenaga Kependidikan</h1>
<p>UPT SDN Kadupeureup</p>
<span class="date" id="tglHead"></span>
</div>
<svg class="wave" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="M0 18 C200 52 400 -8 600 18 C800 44 1000 0 1200 18 L1200 46 L0 46Z"/><path class="b" d="M0 30 C220 58 420 6 640 30 C860 52 1020 14 1200 30 L1200 46 L0 46Z"/></svg>
</header>

<main>

<div class="card">
<div class="note hide" id="note" role="status"></div>
<h2>Isi absensi</h2>

<label class="l" for="nama">Nama</label>
<select id="nama">
<option value="">Pilih nama</option>
<option>Mulyati, S.Pd</option>
<option>Masrosari, S.Pd</option>
<option>Sunjaya, S.Pd</option>
<option>Naiyah, S.Pd</option>
<option>Masrojah, S.Pd</option>
<option>Sri Oktavianingsih, S.Pd</option>
<option>Triyana, S.Pd</option>
<option>Mohamad Deni Janawi, S.Pd</option>
<option>Anggi Permana</option>
<option>Sapriah</option>
</select>

<label class="l" for="peran">Peran</label>
<select id="peran">
<option value="">Pilih peran</option>
<option>Kepala Sekolah</option>
<option>Guru Mapel</option>
<option>Guru Kelas</option>
<option>Operator</option>
</select>

<label class="l">Jenis absensi</label>
<div class="seg" id="jenis">
<label><input type="radio" name="jenis" value="Absen Masuk" checked><span>Absen masuk</span></label>
<label><input type="radio" name="jenis" value="Absen Pulang"><span>Absen pulang</span></label>
</div>

<label class="l">Waktu pengisian</label>
<div class="time">Tanggal dan jam otomatis<b id="waktu"></b></div>
<p class="jam open" id="jamInfo"></p>

<label class="l">Status kehadiran</label>
<div class="seg dk" id="status">
<label class="s-Hadir"><input type="radio" name="status" value="Hadir" checked><span>Hadir</span></label>
<label class="s-Sakit"><input type="radio" name="status" value="Sakit"><span>Sakit</span></label>
<label class="s-Izin"><input type="radio" name="status" value="Izin"><span>Izin</span></label>
</div>

<div id="boxHadir">
<label class="l">Foto langsung</label>
<div class="cam" id="cam"><span>Kamera belum aktif</span></div>
<div class="row">
<button type="button" id="btnCam">Buka kamera</button>
<button type="button" id="btnShot" class="hide">Ambil foto</button>
<button type="button" id="btnRetake" class="hide">Foto ulang</button>
<button type="button" id="btnFile" class="hide">Ambil foto dengan kamera HP</button>
<input type="file" accept="image/*" capture="user" id="fileCam" class="hide">
</div>
<p class="hint">Foto harus diambil langsung, tidak bisa memilih dari galeri.</p>
</div>

<div id="boxIzin" class="hide">
<label class="l" for="ket">Keterangan</label>
<textarea id="ket" placeholder="Contoh: demam, surat dokter terlampir"></textarea>
<label class="l" for="bukti">Bukti (surat dokter, surat izin, dll.)</label>
<input type="file" id="bukti" accept="image/*">
<img id="prevBukti" alt="Pratinjau bukti" class="hide" style="max-width:100%;max-height:220px;margin-top:10px;border-radius:12px">
</div>

<p class="msg" id="msg" role="alert"></p>
<button class="main" type="button" id="btnKirim">Kirim absensi</button>
</div>

<div class="card hide" id="histCard">
<div class="top"><h2>Terkirim dari perangkat ini</h2><button type="button" id="btnHapus" class="hide">Hapus semua</button></div>
<div id="list"></div>
</div>
<footer>UPT SDN Kadupeureup</footer>
</main>

<script>
(function(){
/* GANTI alamat di bawah ini dengan URL Web App dari Google Apps Script (lihat PANDUAN.md) */
var API_URL="https://script.google.com/macros/s/AKfycby158lG8WysSv2W1PpDJgOC0Kp2Rz1fPk6SqNas7U8huE6ttKZlBZnzX1QXO-0-4vFM/exec";
var TZ="Asia/Jakarta",KEY="absensi-guru-terkirim";
var $=function(id){return document.getElementById(id)};
var stream=null,foto=null,bukti=null,local=[],off=0,busy=false;
var DEF={mMulai:"05:00",mAkhir:"08:00",pMulai:"12:00",pAkhir:"17:00"},jam=DEF;

function now(){return new Date(Date.now()+off)}
function fmt(d){
  return d.toLocaleDateString("id-ID",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"})+", "+
    d.toLocaleTimeString("id-ID",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit"}).replace(/\./g,":")+" WIB";
}
function mins(s){var p=String(s).split(":");return(+p[0])*60+(+p[1])}
function nowMin(){var p=now().toLocaleTimeString("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false}).split(":");return(+p[0])*60+(+p[1])}
function val(n){var r=document.querySelector('input[name="'+n+'"]:checked');return r?r.value:""}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function say(t,ok){var m=$("msg");m.textContent=t;m.className="msg"+(ok?" ok":"")}
function note(t){var n=$("note");n.textContent=t;n.classList.toggle("hide",!t)}

function win(){
  var p=val("jenis")==="Absen Pulang",a=p?jam.pMulai:jam.mMulai,b=p?jam.pAkhir:jam.mAkhir,m=nowMin();
  return{a:a,b:b,open:m>=mins(a)&&m<=mins(b)};
}
function jamInfo(){
  var w=win(),h=val("status")==="Hadir",el=$("jamInfo");
  el.textContent=val("jenis")+" untuk status Hadir dibuka pukul "+w.a+" sampai "+w.b+". "+
    (h?(w.open?"Sekarang dibuka.":"Sekarang ditutup."):"Sakit dan izin bisa diisi kapan saja.");
  el.className="jam "+(h&&!w.open?"closed":"open");
}
function tick(){
  $("waktu").textContent=fmt(now());
  $("tglHead").textContent=now().toLocaleDateString("id-ID",{timeZone:TZ,weekday:"long",day:"numeric",month:"long",year:"numeric"});
  jamInfo();
}
tick();setInterval(tick,1000);

/* foto */
function shrink(src,w,h){
  var s=Math.min(1,480/Math.max(w,h)),c=document.createElement("canvas");
  c.width=Math.round(w*s);c.height=Math.round(h*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.6);
}
function fileToUrl(f,cb){
  var r=new FileReader();
  r.onload=function(){var i=new Image();i.onload=function(){cb(shrink(i,i.width,i.height))};i.src=r.result};
  r.readAsDataURL(f);
}
function stopCam(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
function resetCam(){
  stopCam();foto=null;
  $("cam").innerHTML="<span>Kamera belum aktif</span>";
  $("btnShot").classList.add("hide");$("btnRetake").classList.add("hide");$("btnCam").classList.remove("hide");
}
function showFoto(url){
  foto=url;stopCam();
  $("cam").innerHTML='<img alt="Foto absensi" src="'+url+'">';
  ["btnShot","btnCam","btnFile"].forEach(function(i){$(i).classList.add("hide")});
  $("btnRetake").classList.remove("hide");
}
$("btnCam").onclick=function(){
  say("");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $("btnFile").classList.remove("hide");$("cam").innerHTML="<span>Kamera tidak tersedia. Gunakan kamera HP.</span>";return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false}).then(function(s){
    stream=s;var v=document.createElement("video");
    v.autoplay=true;v.playsInline=true;v.muted=true;v.srcObject=s;v.id="vid";
    $("cam").innerHTML="";$("cam").appendChild(v);
    $("btnCam").classList.add("hide");$("btnShot").classList.remove("hide");
  }).catch(function(){
    $("btnFile").classList.remove("hide");
    $("cam").innerHTML="<span>Izin kamera ditolak atau diblokir. Gunakan tombol kamera HP.</span>";
  });
};
$("btnShot").onclick=function(){var v=$("vid");if(v&&v.videoWidth)showFoto(shrink(v,v.videoWidth,v.videoHeight))};
$("btnRetake").onclick=resetCam;
$("btnFile").onclick=function(){$("fileCam").click()};
$("fileCam").onchange=function(e){var f=e.target.files[0];if(f)fileToUrl(f,showFoto)};
$("bukti").onchange=function(e){
  var f=e.target.files[0];bukti=null;
  if(!f){$("prevBukti").classList.add("hide");return}
  fileToUrl(f,function(u){bukti=u;$("prevBukti").src=u;$("prevBukti").classList.remove("hide")});
};
function sync(){
  var h=val("status")==="Hadir";
  $("boxHadir").classList.toggle("hide",!h);$("boxIzin").classList.toggle("hide",h);
  if(!h)resetCam();say("");jamInfo();
}
document.querySelectorAll('input[name="status"]').forEach(function(r){r.onchange=sync});
document.querySelectorAll('input[name="jenis"]').forEach(function(r){r.onchange=jamInfo});

/* daftar terkirim di perangkat ini (tanpa foto, hanya sebagai bukti kirim) */
try{local=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){local=[]}
function renderLocal(){
  $("histCard").classList.toggle("hide",!local.length);
  $("btnHapus").classList.toggle("hide",!local.length);
  $("list").innerHTML=local.slice().reverse().map(function(x){
    return '<div class="item"><div><div class="t">'+esc(x.nama)+' <span class="badge '+esc(x.status)+'">'+esc(x.status)+'</span></div>'+
      '<div class="m">'+esc(x.peran)+', '+esc(x.jenis)+'</div><div class="m">'+esc(x.waktu)+'</div>'+
      (x.ket?'<div class="m">Keterangan: '+esc(x.ket)+'</div>':'')+'</div></div>';
  }).join("");
}
$("btnHapus").onclick=function(){
  if(confirm("Hapus daftar ini dari perangkat? Data di database tidak terhapus.")){local=[];try{localStorage.setItem(KEY,"[]")}catch(e){}renderLocal()}
};

/* kirim */
function ready(){return API_URL&&API_URL.indexOf("http")===0}
$("btnKirim").onclick=function(){
  if(busy)return;
  var nama=$("nama").value,peran=$("peran").value,st=val("status");
  if(!ready()){say("Alamat database belum diatur. Hubungi admin sekolah.");return}
  if(!nama){say("Pilih nama terlebih dahulu.");$("nama").focus();return}
  if(!peran){say("Pilih peran terlebih dahulu.");$("peran").focus();return}
  if(st==="Hadir"&&!win().open){var w=win();say("Di luar jam absensi. "+val("jenis")+" dibuka pukul "+w.a+" sampai "+w.b+".");return}
  if(st==="Hadir"&&!foto){say("Ambil foto langsung terlebih dahulu.");return}
  if(st!=="Hadir"){
    if(!$("ket").value.trim()){say("Isi keterangan untuk "+st.toLowerCase()+".");$("ket").focus();return}
    if(!bukti){say("Unggah bukti untuk "+st.toLowerCase()+".");return}
  }
  var rec={nama:nama,peran:peran,jenis:val("jenis"),status:st,ket:st==="Hadir"?"":$("ket").value.trim(),gambar:st==="Hadir"?foto:bukti};
  busy=true;$("btnKirim").disabled=true;say("Mengirim...");
  fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)})
  .then(function(r){return r.json()})
  .then(function(j){
    if(!j.ok){say(j.error||"Gagal menyimpan.");return}
    local.push({nama:nama,peran:peran,jenis:rec.jenis,status:st,ket:rec.ket,waktu:j.waktu||fmt(now())});
    try{localStorage.setItem(KEY,JSON.stringify(local.slice(-50)))}catch(e){}
    $("ket").value="";$("bukti").value="";bukti=null;$("prevBukti").classList.add("hide");resetCam();
    renderLocal();say("Absensi tersimpan di database.",true);
  })
  .catch(function(){say("Gagal terhubung. Periksa internet lalu coba lagi.")})
  .then(function(){busy=false;$("btnKirim").disabled=false});
};
window.addEventListener("pagehide",stopCam);

/* mulai: ambil jam absensi dan jam server */
renderLocal();
if(!ready()){note("Alamat database belum diatur. Halaman belum bisa mengirim absensi.")}
else{
  fetch(API_URL).then(function(r){return r.json()}).then(function(j){
    if(j&&j.ok){jam=Object.assign({},DEF,j.jam);off=j.now-Date.now();jamInfo()}
  }).catch(function(){note("Belum terhubung ke database. Periksa internet Anda.")});
}
})();
</script>
